<!doctype html>
<html>
<head><meta charset="utf-8"><title>Hermes fixture</title></head>
<body>
  <nav><a href="/home">Home</a> <a href="/about">About us</a></nav>
  <main>
    <h1>Sign up</h1>
    <p>Fill in the form below to create an account.</p>
    <form onsubmit="event.preventDefault(); document.getElementById('out').textContent = 'submitted ' + this.email.value + ' ' + this.plan.value + ' ' + this.tos.checked">
      <label for="email">Email</label> <input id="email" name="email" type="email" placeholder="you@example.com">
      <label>Plan <select name="plan"><option value="free">Free</option><option value="pro">Pro plan</option></select></label>
      <label><input type="checkbox" name="tos"> I agree</label>
      <div role="button" tabindex="0" aria-label="Fancy div button"></div>
      <button type="submit">Create account</button>
      <button type="button" style="display:none">Hidden button</button>
    </form>
    <p id="out"></p>
  </main>
  <script src="../../extension/page.js"></script>
</body>
</html>
